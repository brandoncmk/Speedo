<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>HUD Speed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:manipulation;user-select:none}
body{font-family:Arial,sans-serif}#hud{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#speed{color:#39ff73;transform:scaleX(-1);font-size:min(72vh,47vw);line-height:.75;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:0 0 .025em currentColor,0 0 .07em currentColor}
body.day #speed{color:#fff;font-size:min(88vh,58vw);font-weight:900;letter-spacing:-.07em;text-shadow:none}
#controls{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;z-index:5;transition:opacity .25s}
.ctrl{border:1px solid #333;border-radius:999px;padding:8px 12px;background:#000c;color:#777;font:700 11px system-ui;letter-spacing:.08em;text-transform:uppercase}
.ctrl.active{color:#39ff73;border-color:#246b3b}body.day .ctrl.active{color:#fff;border-color:#888}
#status{position:fixed;right:14px;bottom:10px;color:#555;font:11px system-ui;transition:opacity .25s}
#start{position:fixed;inset:0;z-index:10;border:0;background:#000;color:#39ff73;font:700 24px system-ui;letter-spacing:.1em;text-transform:uppercase}
.hidden-ui #controls,.hidden-ui #status{opacity:0;pointer-events:none}
</style></head><body>
<main id="hud"><div id="speed">0</div></main>
<div id="controls"><button class="ctrl active" id="night">Night</button><button class="ctrl" id="day">Day</button></div>
<div id="status">GPS waiting</div><button id="start">Start HUD</button>
<script>
const speedEl=document.getElementById("speed"),start=document.getElementById("start"),statusEl=document.getElementById("status"),night=document.getElementById("night"),day=document.getElementById("day"),hud=document.getElementById("hud");
let target=0,shown=0,lastUpdate=0,lastSpeed=0,wakeLock=null,uiTimer=null;
function animate(){shown+=(target-shown)*.28;speedEl.textContent=Math.max(0,Math.round(shown));requestAnimationFrame(animate)}animate();
function showUI(){document.body.classList.remove("hidden-ui");clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.add("hidden-ui"),2500)}
function setMode(m){let d=m==="day";document.body.classList.toggle("day",d);day.classList.toggle("active",d);night.classList.toggle("active",!d);localStorage.setItem("hudMode",m);showUI()}
async function full(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}}
async function landscape(){try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(e){}}
async function awake(){try{if("wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}}
function gps(){if(!navigator.geolocation){statusEl.textContent="GPS unavailable";return}statusEl.textContent="Acquiring GPS…";navigator.geolocation.watchPosition(p=>{let s=p.coords.speed;if(typeof s==="number"&&isFinite(s)&&s>=0){lastSpeed=s*3.6;target=lastSpeed;lastUpdate=Date.now();statusEl.textContent="GPS active"}},e=>statusEl.textContent=e.code===1?"Location denied":e.code===2?"GPS unavailable":e.code===3?"GPS timeout":"GPS error",{enableHighAccuracy:true,maximumAge:500,timeout:12000});setInterval(()=>{if(lastUpdate&&Date.now()-lastUpdate>4500&&lastSpeed<4)target=0},1000)}
start.onclick=async()=>{start.style.display="none";await full();await landscape();await awake();gps();showUI()};
night.onclick=e=>{e.stopPropagation();setMode("night")};day.onclick=e=>{e.stopPropagation();setMode("day")};hud.onclick=async()=>{await full();showUI()};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")awake()});
setMode(localStorage.getItem("hudMode")||"night");
</script></body></html>
