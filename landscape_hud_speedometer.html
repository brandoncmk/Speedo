<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Landscape HUD Speed</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  }

  #hud {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #speed {
    color: #39ff73;
    transform: scaleX(-1);
    font-size: min(72vh, 47vw);
    line-height: .75;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.055em;
    text-shadow: 0 0 .025em currentColor, 0 0 .07em currentColor;
  }

  #start {
    position: fixed;
    inset: 0;
    border: 0;
    background: #000;
    color: #39ff73;
    font: 700 24px system-ui, sans-serif;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  #status {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    color: #555;
    font: 11px system-ui, sans-serif;
  }

  @media (orientation: portrait) {
    #speed { font-size: min(45vw, 34vh); }
  }
</style>
</head>
<body>
  <main id="hud"><div id="speed">0</div></main>
  <div id="status">GPS waiting</div>
  <button id="start">Start HUD</button>

<script>
const speedEl = document.getElementById("speed");
const startEl = document.getElementById("start");
const statusEl = document.getElementById("status");

let target = 0;
let shown = 0;
let lastUpdate = 0;
let lastSpeed = 0;
let wakeLock = null;

function animate() {
  shown += (target - shown) * 0.28;
  speedEl.textContent = Math.max(0, Math.round(shown));
  requestAnimationFrame(animate);
}
animate();

async function fullscreen() {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();
  } catch(e) {}
}

async function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock)
      await screen.orientation.lock("landscape");
  } catch(e) {}
}

async function keepAwake() {
  try {
    if ("wakeLock" in navigator)
      wakeLock = await navigator.wakeLock.request("screen");
  } catch(e) {}
}

function startGPS() {
  if (!navigator.geolocation) {
    statusEl.textContent = "GPS unavailable";
    return;
  }

  statusEl.textContent = "Acquiring GPS…";

  navigator.geolocation.watchPosition(
    p => {
      if (typeof p.coords.speed === "number" &&
          isFinite(p.coords.speed) &&
          p.coords.speed >= 0) {
        lastSpeed = p.coords.speed * 3.6;
        target = lastSpeed;
        lastUpdate = Date.now();
        statusEl.textContent = "GPS active";
      }
    },
    e => {
      statusEl.textContent =
        e.code === 1 ? "Location denied" :
        e.code === 2 ? "GPS unavailable" :
        e.code === 3 ? "GPS timeout" : "GPS error";
    },
    { enableHighAccuracy: true, maximumAge: 500, timeout: 12000 }
  );

  setInterval(() => {
    if (lastUpdate && Date.now() - lastUpdate > 4500 && lastSpeed < 4)
      target = 0;
  }, 1000);
}

async function launch() {
  startEl.style.display = "none";
  await fullscreen();
  await lockLandscape();
  await keepAwake();
  startGPS();
}

startEl.addEventListener("click", launch);
document.getElementById("hud").addEventListener("click", fullscreen);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
</script>
</body>
</html>
